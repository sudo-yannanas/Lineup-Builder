<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lineup Builder – Compositions de football</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pitch.css">
</head>
<body>

  <!-- ===== En-tête ===== -->
  <header class="app-header">
    <h1>
      <a href="index.html" style="text-decoration: none; color: inherit;">
        ⚽ Lineup Builder
      </a>
    </h1>

    <div class="header-actions">
      <div class="slots" role="group" aria-label="Sauvegardes locales">
        <div class="slot" data-slot="1">
          <span class="slot-label">Slot 1</span>
          <button class="btn btn-small" data-action="save" data-slot="1" title="Sauvegarder dans le slot 1">💾</button>
          <button class="btn btn-small" data-action="load" data-slot="1" title="Charger le slot 1">📂</button>
        </div>
        <div class="slot" data-slot="2">
          <span class="slot-label">Slot 2</span>
          <button class="btn btn-small" data-action="save" data-slot="2" title="Sauvegarder dans le slot 2">💾</button>
          <button class="btn btn-small" data-action="load" data-slot="2" title="Charger le slot 2">📂</button>
        </div>
        <div class="slot" data-slot="3">
          <span class="slot-label">Slot 3</span>
          <button class="btn btn-small" data-action="save" data-slot="3" title="Sauvegarder dans le slot 3">💾</button>
          <button class="btn btn-small" data-action="load" data-slot="3" title="Charger le slot 3">📂</button>
        </div>
      </div>

      <button id="share-btn" class="btn btn-primary">🔗 Copier le lien de partage</button>
      <a href="resume.html?equipe=seniorsC" class="btn" style="background: #eab308; color: black; font-weight: bold; text-decoration: none; padding: 10px; border-radius: 5px;">📝 Créer le résumé du match</a>

    </div>
  </header>

  <!-- ===== Zone principale ===== -->
  <main class="layout">

    <!-- Terrain -->
    <section class="pitch-wrap">
      
      <!-- DÉBUT DE LA ZONE CAPTURÉE (Terrain + Remplaçants) -->
      <div id="capture-terrain" style="background-color: #1e293b; padding: 15px; border-radius: 10px;">
        
        <div id="pitch" class="formation-433">
          <div class="pitch-lines" aria-hidden="true">
            <span class="halfway"></span>
            <span class="circle"></span>
            <span class="box box-top"></span>
            <span class="box box-bottom"></span>
          </div>
          <!-- 11 zones de dépôt : 0 = gardien, puis de la défense vers l'attaque -->
          <div class="dz" data-slot="0"></div>
          <div class="dz" data-slot="1"></div>
          <div class="dz" data-slot="2"></div>
          <div class="dz" data-slot="3"></div>
          <div class="dz" data-slot="4"></div>
          <div class="dz" data-slot="5"></div>
          <div class="dz" data-slot="6"></div>
          <div class="dz" data-slot="7"></div>
          <div class="dz" data-slot="8"></div>
          <div class="dz" data-slot="9"></div>
          <div class="dz" data-slot="10"></div>
        </div>

        <!-- LÉGENDE DES COULEURS DE POSTES -->
        <div style="display: flex; justify-content: center; gap: 20px; margin: 20px 0 10px 0; padding: 10px; background: #1e293b; border-radius: 8px; border: 1px solid #334155;">
          <span style="color: white; font-size: 0.9em; font-weight: bold; display: flex; align-items: center; gap: 8px;">
            <span style="width: 15px; height: 15px; background: #f59e0b; border-radius: 50%; display: inline-block;"></span> GB
          </span>
          <span style="color: white; font-size: 0.9em; font-weight: bold; display: flex; align-items: center; gap: 8px;">
            <span style="width: 15px; height: 15px; background: #3b82f6; border-radius: 50%; display: inline-block;"></span> DEF
          </span>
          <span style="color: white; font-size: 0.9em; font-weight: bold; display: flex; align-items: center; gap: 8px;">
            <span style="width: 15px; height: 15px; background: #22c55e; border-radius: 50%; display: inline-block;"></span> MIL
          </span>
          <span style="color: white; font-size: 0.9em; font-weight: bold; display: flex; align-items: center; gap: 8px;">
            <span style="width: 15px; height: 15px; background: #ef4444; border-radius: 50%; display: inline-block;"></span> ATT
          </span>
        </div>

        <!-- Zone des remplaçants -->
        <div class="subs-wrap" style="margin-top: 15px;">
          <h3 style="color: white; text-align: center; margin-bottom: 10px;">🔄 Remplaçants</h3>
          <div id="subs" class="subs-zone"></div>
        </div>

      </div>
      <!-- FIN DE LA ZONE CAPTURÉE -->

      <p class="hint" style="margin-top: 15px;">
        Glissez-déposez les joueurs (ou cliquez un joueur puis sa destination).<br>
        <strong>Double-clic</strong> ou <strong>clic droit</strong> sur un joueur : capitaine.
      </p>
    </section>

    <!-- Panneau de contrôle -->
    <aside class="panel">
      <div class="panel-block">
        <label for="formation-select">Formation</label>
        <select id="formation-select"></select>
      </div>

      <div class="panel-block">
        <label for="preset-select">Composition type</label>
        <select id="preset-select">
          <option value="">— Choisir —</option>
        </select>
      </div>

      <div class="panel-block panel-row">
        <button id="clear-btn" class="btn">🧹 Vider le terrain</button>
        <!-- Bouton d'export de la composition -->
        <button id="btn-export-compo" style="background-color: #eab308; color: #0f172a; padding: 10px 20px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 15px; width: 100%; font-size: 1.1em;">
          📸 Partager la composition
        </button>
        <span id="count" class="count">0 / 11 sur le terrain</span>
      </div>

      <div class="panel-block grow">
        <h2>Banc de touche</h2>
        
        <!-- Système de filtres existant -->
        <div class="filter-controls">
          <input type="text" id="search-player" placeholder="Rechercher un joueur..." class="input-search">
          <div class="filter-buttons">
            <button class="btn btn-filter active" data-poste="ALL">Tous</button>
            <button class="btn btn-filter" data-poste="GB">GB</button>
            <button class="btn btn-filter" data-poste="DEF">DEF</button>
            <button class="btn btn-filter" data-poste="MIL">MIL</button>
            <button class="btn btn-filter" data-poste="ATT">ATT</button>
          </div>
        </div>
        
        <div id="bench" class="bench"></div>
      </div>

      <!-- Formulaire d'ajout rapide -->
      <div class="panel-block">
        <label>Ajout rapide (Joueur temporaire)</label>
        <div style="display: flex; gap: 5px;">
          <input type="text" id="custom-player-name" placeholder="Nom..." class="input-search" style="flex: 1;">
          <select id="custom-player-poste" class="input-search" style="width: 75px; padding: 0.5rem;">
            <option value="GB">GB</option>
            <option value="DEF">DEF</option>
            <option value="MIL">MIL</option>
            <option value="ATT" selected>ATT</option>
          </select>
          <button id="add-custom-player-btn" class="btn btn-primary" title="Ajouter au banc">+</button>
        </div>
      </div>
    </aside>

  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- NOUVELLE LIGNE À AJOUTER : -->
  <script>
    const FICHIER_JOUEURS = "EquipeC.json";
    const FICHIER_PRESETS = "presets_EquipeC.json";
  </script>

  <!-- Ordre important : app.js en dernier (il démarre l'application) -->
  <script src="js/formations.js"></script>
  <script src="js/dragdrop.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
