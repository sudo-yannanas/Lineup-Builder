<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lineup Builder - Accueil</title>
  <!-- On charge ton fichier CSS existant pour garder tes couleurs -->
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* Style spécifique pour centrer la page de choix */
    body.page-accueil {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .accueil-box {
      background: #1e293b; /* Couleur de tes panneaux */
      padding: 3rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    .accueil-box h1 {
      color: #22c55e; /* Vert du terrain */
      margin-bottom: 1rem;
      font-size: 2.5rem;
    }
    .accueil-box p {
      color: #cbd5e1;
      margin-bottom: 2rem;
      font-size: 1.2rem;
    }
    .boutons-choix {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-choix {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      transition: transform 0.2s, background 0.2s;
    }
    .btn-choix:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body class="page-accueil">

  <div class="accueil-box">
    <h1>⚽ Lineup Builder</h1>
    <p>Sélectionnez l'outil à lancer :</p>
    
    <div class="boutons-choix">
      <!-- Le bouton vers ta page Seniors qu'on vient de renommer -->
      <a href="EquipeC.html" class="btn btn-primary btn-choix">Seniors C</a>
      
      <!-- Le bouton vers ta page U17 -->
      <a href="U17.html" class="btn btn-primary btn-choix">Équipe U17</a>

      <!-- Le bouton vers le résumé de match -->
      <a href="resume.html" class="btn btn-primary btn-choix" style="background: #eab308; color: #0f172a;">📝 Résumé de match</a>
    </div>
  </div>

</body>
</html>
